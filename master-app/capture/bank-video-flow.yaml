# Maestro flow for the ~6-8s video: launch, open bank, flip through tabs.
# Keep it short on purpose — no per-screen waits, no screenshots.
# Tab navigation uses deep links (see bank-flow.yaml comment).
# The appId placeholder is replaced by the capture workflow.
appId: __BUNDLE_ID__
---
- launchApp:
    clearState: true
- assertVisible: "Templates"
- tapOn: "Bank — Northwind Bank"
- openLink: "glacia-master://templates/bank/accounts"
- openLink: "glacia-master://templates/bank/cards"
- openLink: "glacia-master://templates/bank/activity"
- openLink: "glacia-master://templates/bank/profile"
