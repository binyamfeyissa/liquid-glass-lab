# DIAGNOSTIC flow (round 3, temporary): why do bank's Light/Photo taps
# not stick in the run-5 set (bank-04-light == bank-05-photo == dark)?
# Screenshots are taken ON the Profile tab right after each tap, so the
# tap itself and the deep-link-back persistence are tested separately.
# The waitForAnimationToEnd after scrollUntilVisible lets the profile
# ScrollView settle before the tap lands (candidate cause: tap fired
# mid-scroll and missed the segment). The bank workflow hides the host
# back pill (capture build only), so pill clearance is NOT tested here —
# only the backdrop switch and the status-bar style.
appId: __BUNDLE_ID__
---
- launchApp:
    clearState: true
- assertVisible: "Templates"
- tapOn: "Bank — Northwind Bank"
- waitForAnimationToEnd
- takeScreenshot: dbg-01-home-dark
- openLink: "glacia-master://templates/bank/profile"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Background Light"
    direction: DOWN
    visibilityPercentage: 50
- waitForAnimationToEnd
- tapOn:
    text: "Background Light"
- waitForAnimationToEnd
- takeScreenshot: dbg-02-profile-light
- openLink: "glacia-master://templates/bank"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: dbg-03-home-light
- openLink: "glacia-master://templates/bank/activity"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: dbg-04-activity-light
- openLink: "glacia-master://templates/bank/profile"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Background Photo"
    direction: DOWN
    visibilityPercentage: 50
- waitForAnimationToEnd
- tapOn:
    text: "Background Photo"
- waitForAnimationToEnd
- takeScreenshot: dbg-05-profile-photo
- openLink: "glacia-master://templates/bank"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: dbg-06-home-photo
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
