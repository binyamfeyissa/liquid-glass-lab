# Maestro inspection flow (verify, 2026-11-26): 5 screenshots per template.
# AppId placeholder is replaced by the master-app-inspect-all workflow.
# launchApp has NO clearState here: only inspect-home.yaml clears state,
# at the start of the build. Each flow normalises to home via deep link
# first, so a previous flow ending inside a template cannot break the next one.
# Shots: -01-main (dark) / -02-<screen> (dark) / -03-<screen> (dark) /
# -04-light / -05-photo. Shots 4-5 switch the backdrop via the template's
# OWN BackdropControl (Dark / Light / Photo segments on its Profile tab;
# appearance tab for profile-settings): the host ModeToggle only affects
# the host — each template keeps its own backdrop store. The return trip
# deep-links to the template root (/templates/<slug>), which lands on its
# index tab, the same route the home rows push to.
# Run 7/8 lesson: every openLink pops iOS's system "Open in" alert;
# tap its "Open" button (optional, 2 s) right after each openLink, or the
# deep link never navigates and the leftover alert blocks later flows.
appId: __BUNDLE_ID__
---
- launchApp:
    clearState: false
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- assertVisible: "Templates"
- scrollUntilVisible:
    element:
      text: "Wallet — Orbit Wallet"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn: "Wallet — Orbit Wallet"
- waitForAnimationToEnd
- takeScreenshot: wallet-01-main
- openLink: "glacia-master://templates/wallet/swap"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- takeScreenshot: wallet-02-swap
- openLink: "glacia-master://templates/wallet/activity"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- takeScreenshot: wallet-03-activity
# Shot 4 (light): the template's own BackdropControl on its
# Profile tab, then back to the main screen.
- openLink: "glacia-master://templates/wallet/profile"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "^Light$"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    text: "^Light$"
- waitForAnimationToEnd
- openLink: "glacia-master://templates/wallet"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- takeScreenshot: wallet-04-light
# Shot 5 (photo): the template's own BackdropControl on its
# Profile tab, then back to the main screen.
- openLink: "glacia-master://templates/wallet/profile"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "^Photo$"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    text: "^Photo$"
- waitForAnimationToEnd
- openLink: "glacia-master://templates/wallet"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- takeScreenshot: wallet-05-photo
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
