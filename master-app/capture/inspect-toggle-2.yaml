# Maestro inspection flow: host-toggle round for 2 templates.
# The host toggle changes host TEXT theme only; each template keeps its
# own backdrop state. These shots document the text/background split the
# owner reported (white text, light background). Restores light at end.
appId: __BUNDLE_ID__
---
- launchApp:
    clearState: false
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Templates"
- tapOn: "Backdrop: light. Tap to change."
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Health — Vitalis"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Health — Vitalis"
- waitForAnimationToEnd
- takeScreenshot: health-toggle
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- tapOn: "Backdrop: dark. Tap to change."
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Shop — Lumen"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Shop — Lumen"
- waitForAnimationToEnd
- takeScreenshot: shop-toggle
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd
- tapOn: "Backdrop: image. Tap to change."
- waitForAnimationToEnd
