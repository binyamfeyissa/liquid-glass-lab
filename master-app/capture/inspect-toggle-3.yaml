# Maestro inspection flow: host-toggle round for 2 templates.
# The host toggle changes host TEXT theme only; each template keeps its
# own backdrop state. These shots document the text/background split the
# owner reported (white text, light background). Restores light at end.
appId: __BUNDLE_ID__
---
- launchApp:
    clearState: false
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- assertVisible: "Templates"
- tapOn: "Backdrop: light. Tap to change."
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Stream — Lumen Play"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn: "Stream — Lumen Play"
- waitForAnimationToEnd
- takeScreenshot: stream-toggle
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- tapOn: "Backdrop: dark. Tap to change."
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Wallet — Orbit Wallet"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn: "Wallet — Orbit Wallet"
- waitForAnimationToEnd
- takeScreenshot: wallet-toggle
- openLink: "glacia-master://"
- tapOn:
    text: "^Open$"
    optional: true
    timeout: 2000
- waitForAnimationToEnd
- tapOn: "Backdrop: image. Tap to change."
- waitForAnimationToEnd
