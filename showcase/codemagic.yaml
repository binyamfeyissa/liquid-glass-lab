# Glacia Showcase — Codemagic build definitions.
#
# SETUP (one time, in the Codemagic web UI):
#   1. Push this folder to a GitHub repo.
#   2. In Codemagic, "Add application" and pick that repo. Codemagic reads
#      this codemagic.yaml from the repo automatically.
#   3. If this folder is NOT the repo root, open the app's settings in
#      Codemagic and set the project root / working directory to this
#      folder (or move this file to the repo root and adjust the paths).
#   4. Start the workflow you want from the app's "Start new build" button.
#
# Neither workflow needs any signing accounts or secrets:
#   - android-apk produces a debug-key-signed release APK you can install
#     directly on any Android phone.
#   - ios-unsigned produces an UNSIGNED .ipa. Install it with SideStore
#     (SideStore re-signs it with your free Apple ID on the phone).

workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        CI: "true"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk

  ios-unsigned:
    name: iOS unsigned IPA (SideStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        CI: "true"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build the app with signing disabled
        script: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package the unsigned IPA
        script: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          rm -rf Payload GlaciaShowcase-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r GlaciaShowcase-unsigned.ipa Payload
    artifacts:
      - GlaciaShowcase-unsigned.ipa
