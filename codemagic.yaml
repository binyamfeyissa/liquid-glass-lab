# Codemagic workflow — unsigned iOS build of liquid-glass-lab (v5)
# Drop this file in the ROOT of github.com/binyamfeyissa/liquid-glass-lab
# as codemagic.yaml (replacing v4).
#
# History:
# v1 packaged an empty .ipa (wrong scheme picked alphabetically).
# v2 built the right scheme; compile failed at the library's shader.
# v3 log extraction found the real error: missing Metal Toolchain.
# v4 added `xcodebuild -downloadComponent MetalToolchain` — the shader
#    compiled and the build got all the way to the app target, then died in
#    Expo's own "[Expo] Configure project" phase:
#      "ExpoModulesMacros scan-modules timed out after 5000 ms ...
#       Build again to retry the scan"
#    A known flaky timeout on shared CI machines (cold macro compilation
#    vs a 5-second budget) — not the library, not the app code.
# v5 = v4 + the build step retries xcodebuild ONCE on failure, inside the
#    same step. DerivedData persists between the two attempts on the same
#    machine, so the macro scan is warm on the retry and finishes in time.
#
# Free tier notes (personal Codemagic account): 500 macOS M2 minutes/month,
# 1 build at a time.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (for SideStore/AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: liquid-glass-lab
    scripts:
      - name: Show tool versions
        script: |
          set -euo pipefail
          node --version
          xcodebuild -version
      - name: Install the Metal Toolchain (Xcode 26 ships it separately)
        script: |
          xcodebuild -downloadComponent MetalToolchain
      - name: Install dependencies
        script: |
          set -euo pipefail
          npm ci || npm install
      - name: Generate the native iOS project (Expo prebuild)
        script: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
      - name: Build unsigned for a real device (iphoneos, signing OFF)
        script: |
          set -uo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          PROJECT=$(ls -d ios/*.xcodeproj | head -1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Workspace: $WORKSPACE"
          echo "Project:   $PROJECT"
          echo "Scheme:    $SCHEME"
          run_build() {
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$CM_BUILD_DIR/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee -a "$CM_BUILD_DIR/xcodebuild.log"
            return ${PIPESTATUS[0]}
          }
          : > "$CM_BUILD_DIR/xcodebuild.log"
          run_build
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "########## First attempt failed (exit $STATUS) — retrying once with warm caches ##########"
            run_build
            STATUS=$?
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "================ COMPILER ERRORS (extracted) ================"
            grep -n -B1 -A6 "error:" "$CM_BUILD_DIR/xcodebuild.log" | tail -120
            echo "============================================================="
            exit "$STATUS"
          fi
      - name: Package the unsigned .ipa
        script: |
          set -euo pipefail
          echo "--- Products folders produced ---"
          find "$CM_BUILD_DIR/build/Build/Products" -maxdepth 2 -type d | head -20
          APP_PATH=$(find "$CM_BUILD_DIR/build" -name "*.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found under Release-iphoneos — the build did not produce the app."
            exit 1
          fi
          echo "App: $APP_PATH"
          du -sh "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qry liquid-glass-lab-unsigned.ipa Payload
          ls -la liquid-glass-lab-unsigned.ipa
          SIZE=$(stat -f%z liquid-glass-lab-unsigned.ipa)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: .ipa is only $SIZE bytes — something is still wrong."
            exit 1
          fi
    artifacts:
      - liquid-glass-lab-unsigned.ipa
      - $CM_BUILD_DIR/xcodebuild.log
